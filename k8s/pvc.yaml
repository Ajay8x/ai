apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ajax-data-pvc
  namespace: ajax-ai
  labels:
    app.kubernetes.io/name: ajax-data
    app.kubernetes.io/part-of: ajax-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
