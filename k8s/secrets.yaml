apiVersion: v1
kind: Secret
metadata:
  name: ajax-secrets
  namespace: ajax-ai
  labels:
    app.kubernetes.io/name: ajax-secrets
    app.kubernetes.io/part-of: ajax-ai
type: Opaque
stringData:
  # Replace every placeholder below before applying this manifest.
  # Do not commit real credentials to this file.
  # LLM API Keys (Populate with your keys)
  OPENAI_API_KEY: ""
  GROQ_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  OPENROUTER_API_KEY: ""
  HUGGINGFACE_API_KEY: ""

  # Database Credentials
  POSTGRES_USER: "ajax_user"
  POSTGRES_PASSWORD: ""

  # Meilisearch Master Key
  MEILISEARCH_KEY: ""

  # Admin & Auth Secrets
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: ""
  JWT_SECRET: ""
  ENCRYPTION_KEY: ""
  WEATHER_API_KEY: ""
