apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ajax-ai-hpa
  namespace: ajax-ai
  labels:
    app.kubernetes.io/name: ajax-ai-hpa
    app.kubernetes.io/part-of: ajax-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ajax-ai-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
