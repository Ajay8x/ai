<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AJAX AI - Autonomous Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <!-- Mobile Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>

    <!-- Collapsible Sidebar (Responsive Drawer on Mobile, Docked on Desktop) -->
    <aside class="sidebar" id="sidebar">
        <!-- Sidebar Brand Header -->
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">AJAX AI</span>
            </div>
            <div class="header-right-tools">
                <div class="status-pill" title="Connected to MongoDB Atlas Cloud">
                    <span class="status-dot"></span>
                    <span class="status-text">ONLINE</span>
                </div>
                <!-- Close Button (Mobile Only) -->
                <button class="mobile-close-btn" onclick="toggleSidebar(false)" title="Close Menu">✕</button>
            </div>
        </div>

        <!-- New Chat Primary Action -->
        <button class="new-chat-btn" onclick="startNewChat()">
            <span class="btn-icon">➕</span>
            <span>New Conversation</span>
        </button>

        <!-- Chat History Section -->
        <div class="history-section">
            <div class="section-title-row">
                <span class="section-heading">Recent Conversations</span>
                <button class="icon-refresh-btn" onclick="loadConversationsList()" title="Refresh List">🔄</button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="history-loading">Loading conversations...</div>
            </div>
        </div>

        <!-- Sidebar Bottom User & Settings Footer -->
        <div class="sidebar-footer">
            <div class="user-profile-card">
                <div class="user-avatar">A</div>
                <div class="user-details">
                    <div class="user-name">Ajay Singh</div>
                    <div class="user-badge">● Administrator</div>
                </div>
            </div>
            <button class="voice-toggle-btn" id="ttsToggleBtn" onclick="toggleVoiceSpeech()" title="Toggle Voice Output">
                <span id="ttsIcon">🔈</span>
                <span class="voice-text">Voice Reply: <strong id="ttsStatus">OFF</strong></span>
            </button>
        </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="main-content">
        <!-- Top App Bar -->
        <header class="top-header">
            <div class="top-left">
                <!-- Hamburger Menu Button (Mobile & Tablet) -->
                <button class="hamburger-btn" onclick="toggleSidebar(true)" title="Open Conversations Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="mobile-brand-title">
                    <span class="logo-icon">⚡</span>
                    <span class="logo-text">AJAX AI</span>
                </div>
                <div class="session-info">
                    <span class="session-label">Session:</span>
                    <span class="session-name" id="sessionDisplay">Interactive Web Workspace</span>
                </div>
            </div>

            <div class="top-right">
                <!-- Live Web Search Badge Toggle in Header -->
                <button class="web-search-pill-btn" id="headerWebSearchBtn" onclick="toggleWebSearch()" title="Toggle Live Web Search">
                    <span class="pill-icon">🌐</span>
                    <span class="pill-label">Web Search</span>
                    <span class="pill-indicator" id="webSearchIndicator">OFF</span>
                </button>
            </div>
        </header>

        <!-- Scrollable Messages Container -->
        <div class="chat-viewport">
            <div class="chat-container" id="chatContainer">
                <!-- Welcome Hero Greeting -->
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-icon">⚡</div>
                    <h2 class="welcome-title">Welcome to AJAX AI</h2>
                    <p class="welcome-subtitle">
                        Cloud-native AI Assistant powered by <strong>MongoDB Atlas</strong>, DuckDuckGo Live Search & RAG Document Intelligence.
                    </p>
                    <div class="quick-prompts-grid">
                        <button class="prompt-chip" onclick="sendQuickPrompt('What are the latest AI developments today?')">
                            <span class="chip-icon">🌐</span>
                            <span class="chip-text">Latest AI developments</span>
                        </button>
                        <button class="prompt-chip" onclick="sendQuickPrompt('Explain quantum computing in simple terms')">
                            <span class="chip-icon">💡</span>
                            <span class="chip-text">Explain quantum computing</span>
                        </button>
                        <button class="prompt-chip" onclick="sendQuickPrompt('Write a clean Python script for FastAPI REST endpoint')">
                            <span class="chip-icon">💻</span>
                            <span class="chip-text">Write a Python FastAPI code</span>
                        </button>
                        <button class="prompt-chip" onclick="sendQuickPrompt('What do you remember about my profile and preferences?')">
                            <span class="chip-icon">🧠</span>
                            <span class="chip-text">Check persistent memories</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Attached Documents Chips Bar -->
        <div class="attachment-bar" id="attachmentBar"></div>

        <!-- Input Control Deck -->
        <footer class="input-deck">
            <div class="input-bar-container">
                <!-- Hidden Document Picker -->
                <input type="file" id="fileUploadInput" accept=".pdf,.docx,.doc,.txt,.md,.py,.json,.csv,.png,.jpg,.jpeg,.webp" style="display:none" onchange="handleFileSelected(this)">

                <!-- Attachment Upload Button -->
                <button class="control-btn" onclick="document.getElementById('fileUploadInput').click()" title="Upload File (PDF, DOCX, Code, Images - Max 15MB)">
                    <span>📎</span>
                </button>

                <!-- Voice Mic Button -->
                <button class="control-btn mic-btn" id="micBtn" onclick="toggleVoiceRecording()" title="Speak with Voice">
                    <span>🎙️</span>
                </button>

                <!-- Web Search Quick Toggle Icon Button -->
                <button class="control-btn web-toggle-btn" id="webSearchBtn" onclick="toggleWebSearch()" title="Toggle Web Search (Live Internet)">
                    <span>🌐</span>
                </button>

                <!-- Responsive Text Input Field -->
                <input type="text" id="userInput" class="main-input" placeholder="Ask anything, talk via 🎙️, or upload 📎 PDF..." onkeydown="if(event.key==='Enter') sendMessage()" autocomplete="off">

                <!-- Primary Send Button -->
                <button class="send-action-btn" id="sendBtn" onclick="sendMessage()" title="Send Message">
                    <span class="send-label">Send</span>
                    <span class="send-arrow">➔</span>
                </button>
            </div>
        </footer>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
